# Nixpacks configuration for Railway deployment
[phases.setup]
nixPkgs = ["nodejs", "python312", "python312Packages.pip"]

[phases.install]
cmds = [
    "npm install",
    "pip3 install --upgrade pip",
    "pip3 install -r requirements.txt"
]

[phases.build]
cmds = [
    "npm run build",
    "python3 manage.py collectstatic --noinput",
    "chmod +x start.sh"
]

[start]
cmd = "bash start.sh"
